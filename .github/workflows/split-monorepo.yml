name: Split Monorepo

on:
  push:
    branches: [main]
    tags: ['*']
permissions:
    contents: read
jobs:
  discover:
    name: Discover packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover packages from composer.json files
        id: packages
        run: |
          PACKAGES='[]'
          for composer_file in src/Component/*/composer.json src/Bundle/*/composer.json; do
            [ -f "$composer_file" ] || continue
            LOCAL_PATH=$(dirname "$composer_file")
            REPO_NAME=$(jq -r '.name // empty' "$composer_file" | cut -d'/' -f2)
            if [ -n "$REPO_NAME" ]; then
              PACKAGES=$(echo "$PACKAGES" | jq -c --arg path "$LOCAL_PATH" --arg repo "$REPO_NAME" '. + [{"local_path": $path, "repo_name": $repo}]')
            fi
          done
          echo "matrix=$(echo $PACKAGES | jq -c '{"include": .}')" >> "$GITHUB_OUTPUT"

  split:
    name: Split ${{ matrix.repo_name }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: danharrin/monorepo-split-github-action@v2.4.0
        with:
          package_directory: ${{ matrix.local_path }}
          repository_organization: Ardenexal
          repository_name: ${{ matrix.repo_name }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}

  # Fan-in gate: the split legs run with fail-fast: false and each push is an
  # independent write to a separate downstream repo, so a transient GitHub error on
  # one leg (seen: "! [remote rejected] main -> main (Internal Server Error)") leaves
  # some packages published and others not. Every cross-pin is ^0.5, so a partial
  # publish leaves consumers with unresolvable constraints.
  #
  # NOTE: this gate DETECTS partial publication, it does not PREVENT it. GitHub Actions
  # cannot retry a `uses:` step, so danharrin/monorepo-split-github-action is not wrapped
  # in a retry; the accepted behaviour is that a partial publish fails loudly here and the
  # workflow is re-run. Do not mistake this gate for a fix for the underlying flakiness.
  split-complete:
    name: All packages published (re-run on failure - tag release may be partial)
    runs-on: ubuntu-latest
    needs: [discover, split]
    if: ${{ always() }}
    steps:
      - name: Check split results
        run: |
          if [ "${{ needs.split.result }}" != "success" ]; then
            echo "discover: ${{ needs.discover.result }}, split: ${{ needs.split.result }}"
            echo "::error::Split publication did not fully succeed. On a tag push this means SOME packages were tagged and others were not: the release is PARTIALLY PUBLISHED. Consumers pinning ^0.5 across packages will hit unresolvable constraints until every package is published. Re-run this workflow and confirm every 'Split <package>' leg is green."
            exit 1
          fi
