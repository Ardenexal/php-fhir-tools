name: Package Integrity

# Guards the split-package contract that the monorepo's local autoload hides:
#  - undeclared-deps  (B7-class): each split component must declare in its OWN composer.json
#                      every third-party/sibling package its source uses. Locally the root
#                      autoload + root vendor mask missing requires; this installs each
#                      component in isolation and statically checks for used-but-undeclared symbols.
#  - php-matrix       (B6-class): the suite must run on the declared PHP floor (8.3) AND the
#                      latest (8.4), so a too-low floor or version-specific syntax fails CI.

on:
    pull_request:
    push:
        branches: [ main ]

permissions:
    contents: read

jobs:
    # See the long note on the identical job in pr.yml for why this is a job and not a
    # workflow-level `paths:` filter. No check here is required by the "Protect Main" ruleset
    # today, but package-integrity-passed below exists to be required, and a `paths:` filter
    # would quietly make that impossible.
    changes:
        # Distinct from pr.yml's `changes` so the two check runs are not ambiguous by name.
        name: Detect changed areas (package integrity)
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.classify.outputs.code }}
            packages: ${{ steps.classify.outputs.packages }}
        steps:
            -   uses: actions/checkout@v4

            -   name: Classify the changed paths
                id: classify
                env:
                    GH_TOKEN: ${{ github.token }}
                # Push events fall through to "every area": this workflow also runs on pushes to
                # main, where there is no pull request to ask for a file list and the
                # belt-and-braces re-run is the point. See the longer note on the same job in
                # pr.yml for why each failure path here resolves to running everything.
                run: |
                    if [ "${{ github.event_name }}" = 'pull_request' ]; then
                      .github/scripts/changed-paths.sh \
                        '${{ github.repository }}' '${{ github.event.number }}' \
                        > changed-paths.txt || : > changed-paths.txt
                      echo 'Changed paths:'
                      sed 's/^/  /' changed-paths.txt
                    else
                      : > changed-paths.txt
                    fi

                    if ! .github/scripts/changed-areas.sh < changed-paths.txt > areas.txt; then
                      echo 'change detection failed; treating every area as changed' >&2
                      printf 'code=true\ncodegen=true\ndeps=true\npackages=true\n' > areas.txt
                    fi

                    tee -a "$GITHUB_OUTPUT" < areas.txt

    undeclared-deps:
        name: Undeclared deps (${{ matrix.repo }})
        runs-on: ubuntu-latest
        needs: [ changes ]
        # Seven isolation installs, and what they check is a manifest against its own source.
        # Gated together rather than per leg because a job-level `if:` cannot see `matrix`;
        # splitting them would mean generating the matrix dynamically, which is not worth it.
        #
        # Gating a matrix job at job level is safe HERE and not in pr.yml: no leg of this
        # workflow is a required check, so no context is left pending when the matrix never
        # expands. If `package-integrity-passed` is ever added to the ruleset, this stays fine —
        # it is not matrixed — but these two jobs must not be required leg by leg.
        if: ${{ !cancelled() && needs.changes.outputs.packages != 'false' }}
        env:
            COMPOSER_NO_INTERACTION: 1
        strategy:
            fail-fast: false
            matrix:
                # Generated source is not itself a reason to skip this check: what it verifies is the
                # hand-authored composer.json, and a generated tree drifting away from a manifest
                # nobody regenerates is exactly the failure mode. So CdaModels IS checked even though
                # `generate-models-cda` emits its src/ — its isolation install is cheap.
                # Models/ is excluded only for cost: ~6,000 files across R4/R4B/R5 make an isolation
                # install per leg disproportionate, and it declares one sibling plus brick/date-time.
                include:
                    -   path: src/Component/Metadata
                        repo: fhir-metadata
                    -   path: src/Component/Serialization
                        repo: fhir-serialization
                    -   path: src/Component/FHIRPath
                        repo: fhir-path
                    -   path: src/Component/CodeGeneration
                        repo: fhir-code-generation
                    -   path: src/Component/Validation
                        repo: fhir-validation
                    -   path: src/Component/CdaModels
                        repo: cda-sd-models
                    -   path: src/Bundle/FHIRBundle
                        repo: fhir-bundle
        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: ctype, iconv, zip
                    tools: composer-require-checker

            # Sibling ardenexal/* packages are released together and the new (0.5.x) versions are
            # not on Packagist yet, so resolve them from the in-repo source via path repositories.
            # Each sibling carries a dev-main -> 0.5.x-dev branch-alias, so relax stability for this
            # isolation install only (the edits below land on the ephemeral CI checkout, never the
            # committed manifest). Once 0.5.0 is tagged, siblings resolve as stable and these are no-ops.
            -   name: Wire sibling path repositories
                working-directory: ${{ matrix.path }}
                run: |
                    composer config minimum-stability dev
                    composer config prefer-stable true
                    self=$(jq -r '.name' composer.json)
                    for dir in "$GITHUB_WORKSPACE"/src/Component/* "$GITHUB_WORKSPACE"/src/Bundle/*; do
                        [ -f "$dir/composer.json" ] || continue
                        name=$(jq -r '.name // empty' "$dir/composer.json")
                        [ -z "$name" ] && continue
                        [ "$name" = "$self" ] && continue
                        key=$(echo "$name" | tr '/' '-')
                        composer config "repositories.$key" path "$dir"
                        # Pin an explicit dev version on the sibling so detached-HEAD CI checkouts
                        # don't fall back to dev-<sha> (which the dev-main branch-alias can't match)
                        # and the ^0.5 sibling constraints resolve. No-op once 0.5.0 is tagged.
                        composer config version 0.5.x-dev --working-dir="$dir"
                    done

            -   name: Install in isolation (declared production deps only)
                working-directory: ${{ matrix.path }}
                run: composer install --no-dev --no-progress --prefer-dist

            -   name: Check for undeclared dependencies
                working-directory: ${{ matrix.path }}
                run: composer-require-checker check --config-file="$GITHUB_WORKSPACE/.github/composer-require-checker.json"

    php-matrix:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        needs: [ changes ]
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        env:
            XDEBUG_MODE: off
            COMPOSER_NO_INTERACTION: 1
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.3', '8.4' ]
        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: ctype, iconv, zip

            -   name: Install dependencies
                run: composer install --prefer-dist --no-progress

            -   name: Validate composer manifests
                run: composer validate --strict

            -   name: Run unit suite
                run: composer run test-ai-unit

    # Fan-in gate for branch protection: require this single check instead of the
    # individual matrix legs so the ruleset survives future matrix changes.
    package-integrity-passed:
        runs-on: ubuntu-latest
        needs: [ undeclared-deps, php-matrix ]
        if: ${{ always() }}
        steps:
            -   name: Check matrix results
                # `skipped` passes: change detection found nothing either matrix could react to.
                run: |
                    status=0
                    for pair in "undeclared-deps:${{ needs.undeclared-deps.result }}" \
                                "php-matrix:${{ needs.php-matrix.result }}"; do
                      job=${pair%%:*}
                      result=${pair#*:}
                      echo "$job: $result"
                      if [ "$result" != 'success' ] && [ "$result" != 'skipped' ]; then
                        status=1
                      fi
                    done
                    exit "$status"
