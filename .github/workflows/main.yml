name: Main Branch

on:
    push:
        branches: [ main ]
        # Skip the whole run for documentation-only merges. A workflow-level filter is the right
        # tool here and nowhere else in this repo: nothing in main.yml can be a required status
        # check, because rulesets gate pull requests and this workflow only runs on push. So a
        # skipped run leaves nothing pending. The equivalent in pr.yml has to be a job-level
        # `if:` instead, and the comment on its `changes` job explains why.
        #
        # A deny-list, not an allow-list: an unrecognised new path runs CI. Keep it in step with
        # is_documentation() in .github/scripts/changed-areas.sh — the duplication is unavoidable
        # because a `paths-ignore:` filter cannot call a script.
        #
        # Note `*.md` rather than `**.md`: `*` does not cross a `/`, so this ignores the root
        # markdown only, and the doc locations are then listed one by one. That is deliberate —
        # recipe/ markdown must NOT be ignored. FlexRecipeTest::testDocumentationFiles reads
        # recipe/fhir-bundle/1.0/README.md and asserts it is non-empty, and scripts/validate-recipe.php
        # reads the same tree, so recipe markdown can genuinely fail the integration suite.
        #
        # `.gitignore` is deliberately absent below for the same kind of reason: this workflow
        # closes with a bare `git status --porcelain`, so an ignore rule can turn that step
        # green or red on its own.
        paths-ignore:
            - '*.md'
            - 'docs/**'
            - 'src/**/*.md'
            - 'tests/**/*.md'
            - '.github/**/*.md'
            - 'LICENSE'
            - '.goat-flow/**'
            - '.ai/**'
            - 'mate/**'
            - '.vscode/**'
            - '.devcontainer/**'
            - '.idea/**'
            - '.github/CODEOWNERS'
            - '.github/ISSUE_TEMPLATE/**'
            - '.editorconfig'
            - '.mcp.json'
            - '.worktreeinclude'
            - '.gruff-php.yaml'

permissions:
    contents: read

jobs:
    quality-gate:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: ctype, iconv, zip
                    coverage: xdebug

            -   name: Cache Composer packages
                id: composer-cache
                uses: actions/cache@v4
                with:
                    path: vendor
                    key: ${{ runner.os }}-php-8.3-${{ hashFiles('**/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-php-8.3-

            -   name: Install dependencies
                run: composer install --prefer-dist --no-progress --no-suggest

            -   name: Run linting (Pint) - All Components
                run: composer run lint

            -   name: Run PHPStan static analysis - All Components
                run: composer run phpstan

            # test-coverage runs the CodeGeneration integration suite; see the action for why the
            # packages are required rather than optional.
            -   name: FHIR core packages
                uses: ./.github/actions/fhir-core-packages

            -   name: Run PHPUnit tests with coverage
                run: composer run test-coverage

            -   name: Upload coverage reports to Codecov
                uses: codecov/codecov-action@v5
                with:
                    files: ./coverage/clover.xml
                    fail_ci_if_error: false
                env:
                    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

            -   name: Run security audit
                run: composer audit

            -   name: Verify no uncommitted changes
                run: |
                    if [ -n "$(git status --porcelain)" ]; then
                      echo "Uncommitted changes detected after running quality checks"
                      git status
                      exit 1
                    fi

    component-tests:
        runs-on: ubuntu-latest
        needs: quality-gate
        strategy:
            matrix:
                component: [ bundle, codegen, serialization, fhir-path ]

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: ctype, iconv, zip

            -   name: Install dependencies
                run: composer install --prefer-dist --no-progress --no-suggest

            -   name: Run component-specific linting
                run: composer run lint:${{ matrix.component }}

            -   name: Run component-specific PHPStan
                run: composer run phpstan:${{ matrix.component }}

            -   name: FHIR core packages
                if: matrix.component == 'codegen'
                uses: ./.github/actions/fhir-core-packages

            -   name: Run component-specific tests
                run: composer run test:${{ matrix.component }}

    integration-test:
        runs-on: ubuntu-latest
        needs: [ quality-gate, component-tests ]

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: ctype, iconv, zip

            -   name: Install dependencies
                run: composer install --prefer-dist --no-progress --no-suggest

            -   name: Install demo dependencies
                run: composer install --working-dir=demo --prefer-dist --no-progress

            -   name: FHIR core packages
                uses: ./.github/actions/fhir-core-packages

            -   name: Run integration tests
                run: composer run test-integration

            -   name: Run FHIRPath specification tests
                run: composer run test-fhirpath-spec

            -   name: Test FHIR model generation
                run: |
                    # Test that the generate command works
                    php demo/bin/console list | grep fhir:generate
                    echo "FHIR generation command is available"

            -   name: Test Symfony Flex recipe
                run: composer run test-recipe

            -   name: Validate recipe configuration
                run: composer run validate-recipe

    # NOTE: this matrix does NOT pin symfony/console. framework-bundle 6.4 permits console ^7, and
    # brianium/paratest (a root dev dependency) requires ^7.4.7, so the "6.4.*" leg has always
    # installed console 7.x. That is why nothing here caught the generator commands being written
    # in Symfony's 7.3-only invokable style. The console lower bound is covered by the
    # symfony-lower-bound job below, which installs the component standalone.
    cross-version-test:
        runs-on: ubuntu-latest
        needs: quality-gate
        strategy:
            matrix:
                php-version: [ '8.3', '8.4' ]
                symfony-version: [ '6.4.*', '7.4.*' ]

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP ${{ matrix.php-version }}
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    extensions: ctype, iconv, zip

            -   name: Install dependencies with Symfony ${{ matrix.symfony-version }}
                run: |
                    composer require --dev symfony/framework-bundle:${{ matrix.symfony-version }} --no-update
                    composer install --prefer-dist --no-progress --no-suggest

            -   name: FHIR core packages
                uses: ./.github/actions/fhir-core-packages

            -   name: Run component tests
                run: composer run test:components

            -   name: Test bundle integration
                run: composer run test:bundle

    # Invokes both generator commands against Symfony 6.4 — the lowest version
    # ardenexal/fhir-code-generation declares. See tests/Compat/symfony-6.4/README.md and
    # the identical job in pr.yml, which is where this actually gates changes.
    symfony-lower-bound:
        runs-on: ubuntu-latest
        needs: quality-gate
        env:
            COMPOSER_NO_INTERACTION: 1
        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: ctype, iconv, zip, curl

            -   name: Install the Symfony 6.4 consumer harness
                run: composer install --working-dir=tests/Compat/symfony-6.4 --prefer-dist --no-progress

            # Guards the guard, for every pinned package rather than just console. This job used
            # to check console alone, so symfony/string floated to 7.4 under its own ^6.4|^7.0
            # constraint and the acceptance run below — real generation included — passed against
            # a string version that has pascal(), while every 6.4 consumer was dead on arrival.
            -   name: Assert Symfony 6.4 was actually installed
                run: |
                    status=0
                    for package in console dependency-injection filesystem finder http-client intl string validator; do
                      version="$(composer show --working-dir=tests/Compat/symfony-6.4 --format=json "symfony/${package}" | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')"
                      case "$version" in
                        v6.4.*) echo "ok   symfony/${package} ${version}" ;;
                        *) echo "FAIL symfony/${package} ${version} — expected a 6.4 release"; status=1 ;;
                      esac
                    done
                    exit "$status"

            -   name: Run the Symfony 6.4 acceptance checks
                run: tests/Compat/symfony-6.4/acceptance.sh --with-generation
