name: Deploy Demo

# DISABLED. The deployment does not currently work, so the automatic trigger is removed
# rather than left to fail on every demo/ change and every release tag. `workflow_dispatch`
# keeps the job runnable by hand for whoever fixes it, and keeps the configuration and its
# history in one piece instead of deleting and reconstructing it later.
#
# To re-enable, restore the push trigger below. It read:
#
#     push:
#         branches: [ main ]
#         paths:
#             - 'demo/**'
#             - '.github/workflows/deploy.yml'
#         # Note: tags and paths are both required when used together.
#         # Tag pushes will only trigger if the tagged commit includes demo/ changes.
#         # If you create a tag on a commit that doesn't touch demo/, push an empty
#         # commit to demo/ (e.g. touch demo/.deploy) and retag.
#         tags: [ '*.*' ]
#
# Note for whoever picks this up: the demo image is also what the tag trigger published, so
# nothing else builds ghcr.io/ardenexal/php-fhir-tools while this is off.
on:
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            -   uses: actions/checkout@v4

            -   name: Login to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Docker metadata
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: ghcr.io/ardenexal/php-fhir-tools
                    tags: |
                        type=raw,value=latest
                        type=semver,pattern={{version}}

            -   name: Build and push Docker image
                uses: docker/build-push-action@v6
                with:
                    context: .
                    file: demo/Dockerfile
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}

            -   name: Join Tailscale network
                uses: tailscale/github-action@v4
                with:
                    oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                    oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
                    tags: tag:ci
                    version: latest

            -   name: Deploy to server
                uses: appleboy/ssh-action@v1
                with:
                    host: ${{ secrets.SERVER_TAILSCALE_IP }}
                    username: ${{ secrets.SERVER_USER }}
                    key: ${{ secrets.SERVER_SSH_KEY }}
                    script: |
                        echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                        docker compose -f ${{ secrets.DEPLOY_COMPOSE_PATH }} pull
                        docker compose -f ${{ secrets.DEPLOY_COMPOSE_PATH }} up -d
                        docker image prune -f
