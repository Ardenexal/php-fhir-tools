# .gruff-php.yaml
# Generated by `gruff-php init`. Mirrors gruff-php registry defaults; edit to customise.
# Add project-specific generated paths under paths.ignore, such as var/cache/** or generated/**.
# After reviewing current findings, `gruff-php analyse --generate-baseline` records them as known debt.
# Future analyse/report runs auto-apply gruff-baseline.json; use `gruff-php analyse --no-baseline` to audit without it.
schemaVersion: gruff-php.config.v0.1
minimumPhpVersion: 8.3
minimumSeverity:
    analyse: advisory
    report: none
    dashboard: none
paths:
    ignore:
        - '.agents/**'
        - '.antigravitycli/**'
        - '.claude/**'
        - '.codex/**'
        - '.github/**'
        - '.goat-flow/**'
        - history.json
        - infection-report.json
        - 'src/Vendor/**'
        - 'tests/Fixtures/**'
        # Project-local generated output and build artefacts (see CLAUDE.md: never hand-edited).
        - 'src/Component/Models/src/**'
        - 'vendor/**'
        - 'demo/vendor/**'
        - 'var/**'
        - 'demo/var/**'
        - '.gruff-cache/**'
allowlists:
    acceptedAbbreviations:
        - age
        - app
        - db
        - dto
        - fs
        - id
        - io
        - key
        - log
        - max
        - min
        - now
        - raw
        - rx
        - tx
        - ui
        - url
        - utc
    secretPreviews: []
selection:
    tiers: []
    pillars: []
    rules: []
    excludePillars: []
    excludeRules: []
rules:
    # Cognitive complexity
    complexity.cognitive:
        enabled: true
        threshold: 20
        severity: error
    # Cyclomatic complexity
    complexity.cyclomatic:
        enabled: true
        threshold: 20
        severity: warning
    # Halstead volume
    complexity.halstead-volume:
        enabled: true
        threshold: 8000
        severity: advisory
    # Maintainability index
    complexity.maintainability-index:
        enabled: true
        threshold: 35
        severity: advisory
    # Maximum nesting depth
    complexity.nesting-depth:
        enabled: true
        threshold: 4
        severity: error
    # Unused private constant
    dead-code.unused-private-constant:
        enabled: true
    # Unused private method
    dead-code.unused-private-method:
        enabled: true
    # Unused private property
    dead-code.unused-private-property:
        enabled: true
    # Bare PHPDoc tags
    docs.bare-phpdoc-tags:
        enabled: true
    # Missing class PHPDoc
    docs.missing-class-phpdoc:
        enabled: true
    # Requires constants to explain their purpose with PHPDoc or meaningful local comments; explicit patterns/regexes families cover at most five names while shipped group categories keep contiguous coverage.
    docs.missing-constant-phpdoc:
        enabled: true
        options:
            requirePhpdocForApiConstants: false
            apiPathPatterns: []
    # Missing file PHPDoc
    docs.missing-file-phpdoc:
        enabled: true
    # Missing @param tag
    docs.missing-param-tag:
        enabled: true
    # Requires declared properties to explain their purpose with PHPDoc; an opt-in toggle also accepts meaningful attached line comments.
    docs.missing-property-phpdoc:
        enabled: true
        options:
            acceptLineComments: false
    # Missing method PHPDoc
    docs.missing-public-phpdoc:
        enabled: true
    # Missing README
    docs.missing-readme:
        enabled: true
    # Every documented method must declare its return contract with an @return tag, including methods declared void or never. Constructors and destructors are exempt.
    docs.missing-return-tag:
        enabled: true
    # Missing @throws tag
    docs.missing-throws-tag:
        enabled: true
    # Requires an explanatory comment immediately above configured PCRE calls, their nearest statement owner, or a contiguous sibling group of regex-owning statements. String-labelled match arms and narrow, call-specific callable contracts can provide equivalent context.
    docs.regex-comment:
        enabled: true
        options:
            functionNames:
                - preg_match
                - preg_match_all
                - preg_replace
                - preg_replace_callback
                - preg_split
    # A value-returning function or method must describe its result in its @return tag, not just restate the type, so a reviewer can diff the documented contract against the body. Fires only when an @return tag is present but carries no description; missing docblocks and missing @return tags are owned by docs.missing-public-phpdoc and docs.missing-return-tag, and a wholly tags-only docblock by docs.bare-phpdoc-tags. Void/never returns and constructors/destructors are exempt. Advisory by default; opt in to stricter enforcement via .gruff-php.yaml.
    docs.return-comment:
        enabled: true
    # Stale @param tag
    docs.stale-param-tag:
        enabled: true
    # TODO/FIXME density
    docs.todo-density:
        enabled: true
        threshold: 10
        severity: error
    # Requires local @var type assertions to explain why the asserted type is needed.
    docs.var-annotation-description:
        enabled: true
    # Constructor property promotion candidate
    modernisation.constructor-promotion-candidate:
        enabled: true
    # First-class callable candidate
    modernisation.first-class-callable-candidate:
        enabled: true
    # Forbidden direct global access
    modernisation.forbidden-global-access:
        enabled: true
    # Match expression candidate
    modernisation.match-expression-candidate:
        enabled: true
    # Mixed type overuse
    modernisation.mixed-type-overuse:
        enabled: true
    # Optionally highlights ambiguous positional calls where named arguments may help, but only when parameter names belong to a stable API contract.
    modernisation.named-argument-opportunity:
        enabled: true
        thresholds:
            minPositionalArguments: 5
    # Flags PHPDoc @param/@return/@var/@property tags using mixed where a narrower type would carry more meaning. Unstructured array bags and precise array{...} envelope shapes are exempt.
    modernisation.phpdoc-mixed-overuse:
        enabled: true
    # Flags public mutable state unless its fully qualified class is an explicit lifecycle or integration contract.
    modernisation.public-property:
        enabled: true
        options:
            allowedClasses: []
    # Readonly property candidate
    modernisation.readonly-property-candidate:
        enabled: true
    # Flags short lowercase identifiers that are not declared in acceptedAbbreviations.
    naming.abbreviation-allowlist:
        enabled: true
        options:
            ignoredNames:
                - this
            minLength: 2
            maxLength: 3
    # Accepts predicate prefixes, property/parameter state adjectives, multi-token state suffixes, subject-first propositions, and exact compatibility names while flagging vague Boolean identifiers.
    naming.boolean-prefix:
        enabled: true
        options:
            allowedPrefixes:
                - is
                - has
                - can
                - should
                - will
                - was
                - does
                - all
                - accepts
                - allows
                - contains
                - disables
                - enables
                - excludes
                - extends
                - includes
                - invokes
                - matches
                - permits
                - refers
                - requires
                - returns
                - looks
                - supports
                - touches
                - uses
            stateAdjectiveAllowlist:
                - active
                - enabled
                - disabled
                - applicable
                - generated
                - interactive
                - emitted
                - visible
                - available
                - valid
                - strict
                - silent
                - resolved
                - limited
                - printable
            stateSuffixAllowlist:
                - requested
                - present
                - enabled
                - allowed
            propositionVerbAllowlist:
                - requires
            acceptedBooleanNames: []
            includePublicApi: true
    # Class/file name mismatch
    naming.class-file-mismatch:
        enabled: true
    # Confusing standalone class name
    naming.confusing-name:
        enabled: true
    # Flags functions and methods whose names match the configured replacement list of vague verbs.
    naming.generic-method:
        enabled: true
        options:
            genericNames:
                - process
                - handle
                - execute
                - run
                - manage
                - doIt
                - do
                - perform
                - make
                - compute
    # Flags identifiers that duplicate type information with configured prefixes such as arr, obj, str, or bool.
    naming.hungarian-notation:
        enabled: true
        options:
            typePrefixes:
                - str
                - int
                - float
                - bool
                - arr
                - obj
                - fn
                - cls
    # Catches placeholder, generic, and numbered identifiers that obscure intent.
    naming.identifier-quality:
        enabled: true
        options:
            placeholderNames:
                - foo
                - bar
                - baz
                - tmp
                - temp
                - obj
                - arr
            genericTokens:
                - data
                - entry
                - info
                - input
                - item
                - row
                - thing
                - stuff
                - helper
                - util
                - value
            ignoredNames:
                - _
                - e
                - exception
                - throwable
                - i
                - j
                - k
                - idx
                - index
                - input
                - key
            minScopeReferences: 1
            loopBodyThreshold: 4
    # Flags typed bool properties and parameters named as negative flags unless they explicitly mirror a CLI flag.
    naming.negative-boolean:
        enabled: true
        options:
            cliMirrorAllowlist: []
    # Short variable name
    naming.short-variable:
        enabled: true
    # Flags identifiers that duplicate type information with trailing suffixes such as String, Map, or Boolean.
    naming.suffix-hungarian:
        enabled: true
        options:
            typeSuffixes:
                - String
                - Array
                - List
                - Map
                - Set
                - Hash
                - Object
                - Integer
                - Float
                - Boolean
    # Test method naming consistency
    naming.test-naming-consistency:
        enabled: true
    # Flags dynamic execution, built-in shell and evaluation patterns, and configured additive global function names.
    security.dangerous-function-call:
        enabled: true
        options:
            additionalFunctions: []
    # Forces PHP error display on via ini_set(display_errors, ...), leaking diagnostics in production.
    security.debug-mode-enabled:
        enabled: true
    # Composer path repository
    security.dependency-composer-path:
        enabled: true
    # Composer install-time shell script
    security.dependency-composer-script:
        enabled: true
    # Unpinned Composer dependency constraint
    security.dependency-composer-unpinned:
        enabled: true
    # Composer VCS repository
    security.dependency-composer-vcs:
        enabled: true
    # Disabled SSL verification
    security.disabled-ssl-verification:
        enabled: true
    # Error suppression operator
    security.error-suppression:
        enabled: true
    # extract or compact on request data
    security.extract-compact-user-input:
        enabled: true
    # Risky GitHub Actions workflow
    security.github-actions-risky-workflow:
        enabled: true
    # Header injection risk
    security.header-injection:
        enabled: true
    # Insecure random source
    security.insecure-random:
        enabled: true
    # Path traversal file access
    security.path-traversal-file-access:
        enabled: true
    # Wildcard Access-Control-Allow-Origin combined with Access-Control-Allow-Credentials: true.
    security.permissive-cors:
        enabled: true
    # Process command construction
    security.process-command-construction:
        enabled: true
    # Request-derived data echoed/printed without HTML escaping (reflected XSS).
    security.reflected-xss:
        enabled: true
    # Request-controlled URL
    security.request-controlled-url:
        enabled: true
    # Sensitive data logging
    security.sensitive-data-logging:
        enabled: true
    # Silent catch block
    security.silent-catch:
        enabled: true
    # SQL string concatenation
    security.sql-concatenation:
        enabled: true
        options:
            safeInterpolationReceivers:
                - wpdb
    # Unsafe archive extraction
    security.unsafe-archive-extraction:
        enabled: true
    # Unsafe unserialize usage
    security.unsafe-unserialize:
        enabled: true
    # Unsafe XML loading
    security.unsafe-xml-loading:
        enabled: true
    # Variable include or require path
    security.variable-include:
        enabled: true
        options:
            treatGlobalConstantsAsFixed: true
            dynamicPathConstants: []
    # Weak cryptography primitives
    security.weak-crypto:
        enabled: true
    # Common API key pattern
    sensitive-data.api-key-pattern:
        enabled: true
    # AWS access key
    sensitive-data.aws-access-key:
        enabled: true
    # Database URL password
    sensitive-data.database-url-password:
        enabled: true
    # Committed Google Cloud service-account key JSON (type: service_account with an embedded private key).
    sensitive-data.gcp-service-account-key:
        enabled: true
    # Hardcoded environment value
    sensitive-data.hardcoded-env-value:
        enabled: true
    # High entropy string
    sensitive-data.high-entropy-string:
        enabled: true
        thresholds:
            minLength: 32
            entropy: 4.2
    # JWT token literal
    sensitive-data.jwt-token:
        enabled: true
    # PHI identifier pattern
    sensitive-data.phi-pattern:
        enabled: true
    # PII in test fixture
    sensitive-data.pii-test-fixture:
        enabled: true
    # Private key material
    sensitive-data.private-key:
        enabled: true
    # HTTP(S) URL with an inline user:password@host credential.
    sensitive-data.url-credentials:
        enabled: true
    # Average method length (logical lines: statements only, averaged across the type's methods)
    size.average-method-length:
        enabled: true
        threshold: 50
        severity: error
    # Class length (substantive lines: blank and comment-only lines are free)
    size.class-length:
        enabled: true
        threshold: 1000
        severity: error
    # File length (substantive lines: blank and comment-only lines are free)
    size.file-length:
        enabled: true
        threshold: 1000
        severity: error
    # Method length (logical lines: statements, not blank or comment lines)
    size.method-length:
        enabled: true
        threshold: 100
        severity: error
    # Parameter count
    size.parameter-count:
        enabled: true
        threshold: 10
        severity: error
        options:
            promotedConstructorMaxParameters: 25
            constructorMaxParameters: 0
    # Property count
    size.property-count:
        enabled: true
        threshold: 15
        severity: error
    # Public method count
    size.public-method-count:
        enabled: true
        threshold: 25
        severity: error
    # Conditional test logic
    test-quality.conditional-logic:
        enabled: true
        options:
            ignoredPathPatterns: []
    # Data provider annotation
    test-quality.data-provider-annotation:
        enabled: true
    # Eager test
    test-quality.eager-test:
        enabled: true
        thresholds:
            minAssertions: 3
    # Empty data provider
    test-quality.empty-data-provider:
        enabled: true
    # Exception type-only assertion
    test-quality.exception-type-only:
        enabled: true
    # Excessive mocking
    test-quality.excessive-mocking:
        enabled: true
        thresholds:
            maxMocks: 3
    # Test extends production class
    test-quality.extends-production-class:
        enabled: true
        options:
            additionalTestBaseClasses: []
    # Global state mutation in test
    test-quality.global-state-mutation:
        enabled: true
    # Assertion in loop without message
    test-quality.loop-assertion-without-message:
        enabled: true
    # Magic number assertion
    test-quality.magic-number-assertion:
        enabled: true
        options:
            allowedLiterals:
                - 200
                - 201
                - 202
                - 204
                - 301
                - 302
                - 303
                - 304
                - 307
                - 308
                - 400
                - 401
                - 403
                - 404
                - 405
                - 409
                - 410
                - 422
                - 429
                - 500
                - 502
                - 503
                - 504
    # Mock-only test
    test-quality.mock-only-test:
        enabled: true
    # Mock without expectation
    test-quality.mock-without-expectation:
        enabled: true
    # Mocking a domain object
    test-quality.mocking-domain-object:
        enabled: true
        options:
            domainNamespaces: []
    # Multiple arrange-act-assert cycles
    test-quality.multiple-aaa-cycles:
        enabled: true
        thresholds:
            minCycles: 3
        options:
            ignoredPathPatterns: []
    # Mystery guest
    test-quality.mystery-guest:
        enabled: true
    # Test naming consistency
    test-quality.naming-consistency:
        enabled: true
        options:
            poorNamePatterns:
                - '/^test[A-Z][A-Za-z]*(?:Works|Basic|Simple|Test)$/'
                - '/^test[A-Z][A-Za-z]*\d+$/'
    # Test without assertions
    test-quality.no-assertions:
        enabled: true
    # PHPUnit coverage source missing
    test-quality.phpunit-coverage-source-missing:
        enabled: true
    # PHPUnit deprecations not fatal
    test-quality.phpunit-deprecations-not-fatal:
        enabled: true
    # PHPUnit strict flags missing
    test-quality.phpunit-strict-flags-missing:
        enabled: true
    # Private member reflection
    test-quality.private-reflection:
        enabled: true
    # Repeated test structure missing data provider
    test-quality.repeated-structure-missing-data-provider:
        enabled: true
        options:
            ignoredPathPatterns: []
    # Setup bloat
    test-quality.setup-bloat:
        enabled: true
        thresholds:
            minSetupLines: 8
    # Skipped test without reason
    test-quality.skipped-without-reason:
        enabled: true
    # Sleep or wall-clock read in test
    test-quality.sleep-in-test:
        enabled: true
    # Flags tests whose main assertion appears to verify only a static source declaration.
    test-quality.static-analysis-redundant-test:
        enabled: true
    # Test name mentions SUT that is not called
    test-quality.sut-not-called:
        enabled: true
    # Tautological type assertion
    test-quality.tautological-type-assertion:
        enabled: true
    # Test longer than apparent SUT
    test-quality.test-longer-than-sut:
        enabled: true
        thresholds:
            minTestLines: 12
    # Test method too long
    test-quality.test-method-too-long:
        enabled: true
        thresholds:
            maxMeaningfulLines: 25
        options:
            pathOverrides: []
    # Testdox readability
    test-quality.testdox-readability:
        enabled: true
        thresholds:
            minWords: 2
    # Trivial assertion
    test-quality.trivial-assertion:
        enabled: true
    # Trivial snapshot
    test-quality.trivial-snapshot:
        enabled: true
        thresholds:
            maxLiteralLength: 5
    # Unused mock variable
    test-quality.unused-mock:
        enabled: true
    # Commented-out code
    waste.commented-out-code:
        enabled: true
    # Empty class
    waste.empty-class:
        enabled: true
    # Empty method
    waste.empty-method:
        enabled: true
    # Flags trivial methods that only wrap a one-line call expression.
    waste.one-line-method:
        enabled: true
        options:
            minParameters: 1
            minInFileCallers: 2
            namedAlternativeFactoryExempt: true
            allowedSymbols: []
    # Flags variables that only store a value immediately returned by the next statement, when the assignment and the return are the only two statements in their block.
    waste.redundant-variable:
        enabled: true
    # Unreachable code
    waste.unreachable-code:
        enabled: true
    # Unused import
    waste.unused-import:
        enabled: true
    # Unused parameter
    waste.unused-parameter:
        enabled: true
